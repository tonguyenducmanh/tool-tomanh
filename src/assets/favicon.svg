<svg width="680" height="680" viewBox="0 0 680 680" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Terminal icon macOS style square</title>
  <desc>Black background, white bordered square window with macOS dots and centered >_ prompt</desc>

  <rect width="680" height="680" fill="none"/>

  <rect x="80" y="80" width="520" height="520" rx="36" fill="#ffffff" stroke="#ffffff" stroke-width="8"/>

  <rect x="80" y="115" width="520" height="35" fill="#ffffff"/>
  <line x1="80" y1="150" x2="600" y2="150" stroke="#dddddd" stroke-width="1.5"/>

  <circle cx="140" cy="115" r="14" fill="#ff5f57"/>
  <circle cx="185" cy="115" r="14" fill="#febc2e"/>
  <circle cx="230" cy="115" r="14" fill="#28c840"/>

  <path d="M80 150 h520 v414 q0 36 -36 36 h-448 q-36 0 -36 -36 z" fill="#000000"/>

  <rect x="80" y="80" width="520" height="520" rx="36" fill="none" stroke="#ffffff" stroke-width="8"/>

  <text x="340" y="375" text-anchor="middle" dominant-baseline="middle" font-family="monospace" font-size="255" font-weight="700" fill="#ffffff">&gt;_</text>
</svg>